name: Update Weather Data

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Data source to update'
        required: true
        default: 'openmeteo'
        type: choice
        options:
          - openmeteo

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch weather data
        run: |
          if [ "${{ github.event.inputs.source }}" = "openmeteo" ]; then
            python scripts/fetch_openmeteo.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          git diff --staged --quiet || git commit -m "Update weather data from ${{ github.event.inputs.source }}"
          git push
